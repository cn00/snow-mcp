[metadata]
name = servicenow-mcp-server
version = 0.1.0
description = ServiceNow MCP server with tools for incident, change, catalog, and agile management
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
license = MIT
license_files = LICENSE
platforms = any

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    fastmcp>=2.12.0,<3.0.0
    requests>=2.31.0
    httpx
    pydantic
    python-dotenv>=1.0.0
    msal>=1.30.0
    mangum>=0.19,<1

[options.packages.find]
where = src
