version: 1
disable_existing_loggers: false

formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    format: '%(asctime)s %(levelprefix)s %(message)s'
  access:
    # "()": app.utils.logger.UvicornAccessJsonFormatter
    # format: '%(asctime)s %(levelname)s %(name)s %(client_addr)s %(status_code)s %(path)s %(message)s'
    "()": uvicorn.logging.AccessFormatter
    format: '%(asctime)s %(levelprefix)s %(client_addr)s %(status_code)s "%(request_line)s"'


handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  error:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [console]
    level: INFO
    propagate: false

  uvicorn.error:
    handlers: [error]
    level: INFO
    propagate: false

  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false

  servicenow_mcp_server.utils:
    level: DEBUG
    handlers: [console]
    propagate: false
